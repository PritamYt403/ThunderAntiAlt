
name: Build ThunderAntiAlt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build ThunderAntiAlt
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAntiAlt-JAR
          path: target/ThunderAntiAlt.jar
          if-no-files-found: error
          retention-days: 14
