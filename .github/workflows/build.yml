
name: Build ThunderAntiAlt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thunderantialt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-1-21:
    name: Paper 1.21.x (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Paper 1.21.x
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prepare JAR
        shell: bash
        run: |
          set -e
          mkdir -p output
          echo "JAR files generated:"
          find target -maxdepth 1 -type f -name "*.jar" -print
          JAR=$(find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            | head -n 1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR generated. Check Maven build and pom.xml."
            exit 1
          fi
          cp "$JAR" output/ThunderAntiAlt-1.21.jar

      - name: Upload Paper 1.21.x JAR
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAntiAlt-1.21
          path: output/ThunderAntiAlt-1.21.jar
          if-no-files-found: error
          retention-days: 14

  build-26x:
    name: Paper 26.x (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Paper 26.x
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dmaven.compiler.release=25 \
            -Dpaper.api.version=26.1.2.build.74-stable \
            clean package

      - name: Prepare JAR
        shell: bash
        run: |
          set -e
          mkdir -p output
          echo "JAR files generated:"
          find target -maxdepth 1 -type f -name "*.jar" -print
          JAR=$(find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            | head -n 1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR generated. Check Maven build and pom.xml."
            exit 1
          fi
          cp "$JAR" output/ThunderAntiAlt-26x.jar

      - name: Upload Paper 26.x JAR
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAntiAlt-26x
          path: output/ThunderAntiAlt-26x.jar
          if-no-files-found: error
          retention-days: 14
