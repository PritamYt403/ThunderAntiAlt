
name: ThunderAntiAlt
version: '2026.0.2'
main: com.pritamx.thunderantialt.ThunderAntiAlt
api-version: '1.21'
author: PritamGaming
description: Advanced Anti-Alt Account Protection System

commands:
  thunderantialt:
    description: ThunderAntiAlt administration commands
    usage: "/ta <help|setmain|pending|approve|deny|info|removeuser|ban|unban|reload>"
    aliases:
      - ta

permissions:
  thunderantialt.admin:
    description: Manage all ThunderAntiAlt features
    default: op

  thunderantialt.bypass:
    description: Legacy permission; does not bypass account verification
    default: false
