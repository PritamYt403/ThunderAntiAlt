
settings:
  # Legacy compatibility
  max-accounts-per-ip: 1
  require-new-ip-approval: true
  alert-admins: true
  log-blocked-attempts: true
  log-successful-logins: true
  account-tracking: true
  pending-approval: true

database:
  file: accounts.db

security:
  fail-closed-on-database-error: true
  mask-ip-in-general-info: true
  block-unauthorized-accounts: true

proxy:
  enabled: false
  type: NONE

floodgate:
  enabled: false

# Professional Server Announcements
announcements:
  # Enable or disable automatic announcements
  enabled: true

  # Announcement interval in seconds
  # 300 seconds = 5 minutes
  interval-seconds: 300
